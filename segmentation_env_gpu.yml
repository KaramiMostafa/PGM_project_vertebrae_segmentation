name: segmentation
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=11.8  # requires compatible NVIDIA driver; bundles CUDA 11.8 runtime
  - numpy
  - scipy
  - scikit-image
  - pillow
  - pip
  - pip:
      - opencv-python-headless
      - pydensecrf
